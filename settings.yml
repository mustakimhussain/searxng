use_default_settings: true

general:
  debug: false
  instance_name: "SearXNG Instance"
  donation_url: false
  contact_url: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  default_lang: "auto"
  formats:
    - html
    - json

server:
  secret_key: "${SEARXNG_SECRET}"
  port: 8080
  bind_address: "0.0.0.0"
  limiter: true
  
outgoing:
  request_timeout: 5.0
  max_request_timeout: 15.0

valkey:
  url: "${SEARXNG_VALKEY_URL}"

engines:
  # General web engines
  - name: bing
    disabled: false

  - name: brave
    disabled: false

  - name: duckduckgo
    disabled: false

  - name: google
    disabled: false

  - name: google cse
    disabled: false

  - name: mojeek
    disabled: false

  - name: qwant
    disabled: false

  - name: startpage
    disabled: false

  # Reference and specialist engines
  - name: wikipedia
    disabled: false

  - name: wikidata
    disabled: false

  - name: currency
    disabled: false

  - name: dictzone
    disabled: false

  - name: 1x
    disabled: false
